<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Hunt</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wh">
    <header class="wh-header">
      <a class="icon-btn" href="../" aria-label="Back to all games">🏠</a>
      <h1 id="theme-title" class="theme-title"></h1>
      <button id="skip-btn" class="icon-btn" aria-label="New puzzle">🔄</button>
    </header>

    <main class="wh-main">
      <div id="grid" class="grid"></div>
      <div id="clues" class="clues"></div>
      <button id="new-btn" class="new-btn hidden">New puzzle ▶</button>
    </main>
  </div>

  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script src="../shared/words.js"></script>
  <script src="../shared/confetti.js"></script>
  <script src="app.js"></script>
</body>
</html>
