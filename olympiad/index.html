<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olympiad Practice</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ol">
    <!-- Pick a paper -->
    <section id="home-screen">
      <header class="ol-header">
        <a class="icon-btn" href="../" aria-label="Back to all sections">🏠</a>
        <h1 class="ol-title">Maths Olympiad</h1>
        <span class="icon-btn spacer" aria-hidden="true"></span>
      </header>
      <p class="exam-info">Mock papers like the iOM Level 1 (Class 1) paper:<br /><b>25 questions · 40 minutes · 100 marks</b></p>

      <div class="mode-pick" role="radiogroup" aria-label="Mode">
        <button class="mode-btn" data-mode="mock" role="radio">📝 Mock test<small>Timer on, answers at the end</small></button>
        <button class="mode-btn" data-mode="practice" role="radio">🌱 Practice<small>See if you're right each time</small></button>
      </div>

      <h2 class="papers-title">Choose a paper</h2>
      <div id="papers" class="papers"></div>
    </section>

    <!-- Taking a paper -->
    <section id="test-screen" class="hidden">
      <header class="ol-header">
        <button id="quit-btn" class="icon-btn" aria-label="Stop this paper">✖</button>
        <div class="test-status">
          <span id="q-count"></span>
          <span id="timer" class="timer"></span>
        </div>
        <button id="speak-btn" class="icon-btn" aria-label="Read the question aloud">🔊</button>
      </header>

      <div id="palette" class="palette" aria-label="Questions"></div>

      <main class="question">
        <div id="q-section" class="q-section"></div>
        <p id="q-prompt" class="q-prompt"></p>
        <div id="q-figure" class="q-figure"></div>
        <div id="q-options" class="q-options"></div>
        <p id="q-feedback" class="q-feedback"></p>
      </main>

      <nav class="q-nav">
        <button id="prev-btn" class="nav-btn">◀ Back</button>
        <button id="next-btn" class="nav-btn primary">Next ▶</button>
      </nav>
    </section>

    <!-- Score and review -->
    <section id="result-screen" class="hidden">
      <header class="ol-header">
        <button id="home-btn" class="icon-btn" aria-label="Back to papers">◀</button>
        <h1 id="result-title" class="ol-title"></h1>
        <span class="icon-btn spacer" aria-hidden="true"></span>
      </header>
      <div class="score-card">
        <div id="score-big" class="score-big"></div>
        <div id="score-note" class="score-note"></div>
      </div>
      <table id="section-table" class="section-table"></table>
      <div class="result-actions">
        <button id="retake-btn" class="nav-btn">🔁 Try again</button>
        <button id="next-paper-btn" class="nav-btn primary">Next paper ▶</button>
      </div>
      <h2 class="review-title">Check your answers</h2>
      <div id="review" class="review"></div>
    </section>
  </div>

  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script src="../shared/confetti.js"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
